name: Publish to PyPI

# Triggered when a version tag (v*) is pushed. Builds the wheel + sdist
# and uploads to PyPI using an API token stored in the PYPI_API_TOKEN
# repository secret.
#
# To enable:
#   1. Create a PyPI API token scoped to the bacsys-pymod project at
#      https://pypi.org/manage/account/token/
#   2. Add it as a repository secret named PYPI_API_TOKEN in
#      Settings → Secrets and variables → Actions → New repository secret.
#   3. Bump the version in pyproject.toml and src/pymod/__init__.py.
#   4. git tag v0.1.1 -m "Release 0.1.1" && git push --tags
#
# Future upgrade: switch to PyPI Trusted Publishing (OIDC, no token needed).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload dist/*
