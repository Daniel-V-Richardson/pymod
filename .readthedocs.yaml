# Read the Docs configuration. Place this file at the repository root.
#
# Build the Sphinx site at docs/conf.py against the package installed with
# its `docs` extras.
#
# Once your repo is on GitHub:
#   1. Sign in at https://readthedocs.org with your GitHub account.
#   2. Import the repo (the "Import a Project" button).
#   3. Read the Docs detects this file automatically and builds the site.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip
  - pdf

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
